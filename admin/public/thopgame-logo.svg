<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 140 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Glowing Top Cap Gradient -->
    <linearGradient id="thopCapGradAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Electric Blue Gradient for Stem -->
    <linearGradient id="thopStemGradAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="50%" stop-color="#0066FE" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Controller Body White/Ice Glow -->
    <linearGradient id="thopCtrlGlowAdmin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Crisp Sharp Shadow -->
    <filter id="thopGlowShadowAdmin" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0051FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#thopGlowShadowAdmin)">
    <!-- Top Horizontal Bar of T (Curved Gamepad Hood Shape) -->
    <path 
      d="M 38 74 C 38 52 56 38 78 38 L 122 38 C 144 38 162 52 162 74 C 162 82 156 89 148 89 C 142 89 138 84 136 78 C 131 66 122 58 108 58 L 92 58 C 78 58 69 66 64 78 C 62 84 58 89 52 89 C 44 89 38 82 38 74 Z" 
      fill="url(#thopCapGradAdmin)"
    />

    <!-- Vertical Stem of T (Curved Rounded Pill Shape) -->
    <rect 
      x="77" 
      y="82" 
      width="46" 
      height="80" 
      rx="23" 
      fill="url(#thopStemGradAdmin)" 
    />
    
    <!-- Glossy Highlight on Stem -->
    <path
      d="M 77 105 C 77 92 87 82 100 82 C 104 82 108 83 111 85 C 93 93 83 110 83 130 C 83 145 88 153 93 158 C 83 154 77 143 77 130 Z"
      fill="#ffffff"
      opacity="0.25"
    />

    <!-- Embedded Modern Game Controller Face Inside Top Head of T -->
    <g>
      <!-- Gamepad White Chassis -->
      <path 
        d="M 62 60 C 62 50 70 44 80 44 L 120 44 C 130 44 138 50 138 60 C 138 69 133 76 125 76 C 117 76 114 70 108 70 L 92 70 C 86 70 83 76 75 76 C 67 76 62 69 62 60 Z" 
        fill="url(#thopCtrlGlowAdmin)"
      />

      <!-- D-Pad (Left Side of Gamepad) -->
      <g fill="#0F172A">
        <rect x="74.5" y="52" width="5" height="15" rx="1.5" />
        <rect x="69.5" y="57" width="15" height="5" rx="1.5" />
      </g>

      <!-- Action Buttons 4-Dot Diamond (Right Side of Gamepad) -->
      <g>
        <circle cx="123" cy="54.5" r="2.2" fill="#3B82F6" />
        <circle cx="128.5" cy="59.5" r="2.2" fill="#10B981" />
        <circle cx="117.5" cy="59.5" r="2.2" fill="#F59E0B" />
        <circle cx="123" cy="64.5" r="2.2" fill="#EF4444" />
      </g>
    </g>
  </g>
</svg>
